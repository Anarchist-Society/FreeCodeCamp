<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <title>Margin Collpasing</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Ejemplo 1: Colapso entre hermanos -->
    <!-- El margen entre estos dos elementos será el del mayor, en este caso será de 30px -->
    <div class="box1">Box 1</div>
    <div class="box2">Box 2</div>

    <!-- Ejemplo 2: Colapso padre-hijo -->
    <div class="parent">
      <div class="child">Child element</div>
    </div>

    <!-- Ejemplo 3: Colapso en bloque vacío -->
    <!-- Si un elemento no tiene contenido, padding o border, sus márgenes superior e inferior pueden colapsar en un solo margen -->
    <!-- Los márgenes del bloque vacío se colapsan en un único margen de 20px, el mayor de los dos -->
    <div class="empty-block"></div>
    <div class="next-block">Next block</div>

    <!-- Ejemplo 4: Prevención del colapso usando padding -->
    <!-- El padding de 1px evita que el margen se colapse, dando un espacio total de 71px -->
    <div class="parent2">
      <div class="child2">Child element</div>
    </div>
  </body>
</html>
