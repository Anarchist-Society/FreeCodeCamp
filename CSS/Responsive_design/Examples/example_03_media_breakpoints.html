<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Breakpoints</title>
    <style>
      /* Fuente más grande en pantallas anchas */
      @media screen and (min-width: 768px) {
        body {
          font-size: 1.125rem;
        }
      }

      /* Breakpoints comunes por categoría de dispositivo: */
      /* Smartphones: hasta 640px */
      /* Tablets: 641px a 1024px */
      /* Desktops: 1025px en adelante */

      /* Breakpoints más granulares: */
      /* Extra small: hasta 576px */
      /* Small: 577px a 768px */
      /* Medium: 769px a 992px */
      /* Large: 993px a 1200px */
      /* Extra large: 1201px en adelante */

      /* Otros ejemplos de breakpoints: */
      /* Extra small: menos de 576px */
      /* Small: 576px o más */
      /* Medium: 768px o más */
      /* Large: 992px o más */
      /* Extra large: 1200px o más */
      /* Extra extra large: 1400px o más */
    </style>
  </head>

  <body>
    <div>
      <h1>Responsive Design</h1>
      <p>This is a simple example of responsive design using media queries.</p>
    </div>
  </body>
</html>
