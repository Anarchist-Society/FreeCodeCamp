<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What Is the Mobile First Approach in Responsive Web Design?</title>
    <style>
      /* Estilos base para móvil (mobile first) */
      .container {
        width: 100%;
        padding: 10px;
      }

      /* Tablet: font-size más grande, ancho fijo, centrado */
      @media screen and (min-width: 768px) {
        body {
          font-size: 1.2rem;
        }

        .container {
          width: 750px;
          margin: 0 auto;
          padding: 20px;
        }
      }

      /* Desktop: ancho aún mayor */
      @media screen and (min-width: 1024px) {
        .container {
          width: 960px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Responsive Design</h1>
      <p>This is a simple example of responsive design using media queries.</p>
    </div>
  </body>
</html>
