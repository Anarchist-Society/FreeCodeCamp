<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <title>Composition</title>
    <!-- CSS externo -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Título principal -->
    <h1>Composition &amp; Balance</h1>

    <!-- Balance simétrico: pesos iguales a ambos lados -->
    <div class="section symmetrical">
      <!-- Contenedor flex con 3 cajas -->
      <div class="box-container">
        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">A</div>
      </div>
      <div class="description">
        Symmetrical Balance – Equal weight on both sides.
      </div>
    </div>

    <!-- Balance asimétrico: pesos diferentes pero armónicos -->
    <div class="section asymmetrical">
      <!-- La caja del centro (C) es más grande y de otro color -->
      <div class="box-container">
        <div class="box">A</div>
        <div class="box">C</div>
        <div class="box">B</div>
      </div>
      <div class="description">
        Asymmetrical Balance – Unequal but still harmonious.
      </div>
    </div>
  </body>
</html>
