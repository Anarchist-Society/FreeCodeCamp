<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <title>Contrast</title>
    <!-- CSS externo -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Contenedor centrado, fondo blanco, sombra -->
    <div class="container">
      <!-- Título principal -->
      <h1>Contrast in Design</h1>

      <!-- Texto introductorio -->
      <p>
        Contrast helps draw attention to important elements. It also makes
        content easier to read and visually engaging.
      </p>

      <!-- Caja de alto contraste: fondo oscuro, texto blanco -->
      <div class="highlight-box">
        This box stands out because of strong color contrast.
      </div>

      <!-- Botón de alto contraste: rojo con hover -->
      <button class="high-contrast-button">Example button</button>

      <!-- Texto de bajo contraste: difícil de leer -->
      <p class="low-contrast-text">
        This text is harder to read due to low contrast with the background.
      </p>
    </div>
  </body>
</html>
