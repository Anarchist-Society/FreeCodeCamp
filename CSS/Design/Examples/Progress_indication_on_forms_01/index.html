<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport para móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <title>Progress Indication on Forms</title>
    <!-- CSS externo -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Formulario multi-paso con id para manipularlo con JS -->
    <form id="multiStepForm">
      <!-- Barra de progreso -->
      <div class="form-progress">
        <label class="progress-label">Form progress</label>
        <div class="progress-container">
          <!-- Barra verde que crece con CSS transition -->
          <div class="progress-bar"></div>
          <!-- Texto centrado encima de la barra -->
          <div class="progress-text">Step 1 of 3</div>
        </div>
      </div>

      <!-- Paso 1: Información personal -->
      <fieldset class="form-step active">
        <legend>Personal Information</legend>
        <label for="name">Full Name:</label>
        <!-- required: obligatorio para avanzar -->
        <input type="text" id="name" name="name" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <!-- type="button": no envía el formulario -->
        <button type="button" class="next-btn">Next</button>
      </fieldset>

      <!-- Paso 2: Dirección -->
      <fieldset class="form-step">
        <legend>Address</legend>
        <label for="address">Street Address:</label>
        <input type="text" id="address" name="address" required />

        <label for="city">City:</label>
        <input type="text" id="city" name="city" required />

        <button type="button" class="prev-btn">Previous</button>
        <button type="button" class="next-btn">Next</button>
      </fieldset>

      <!-- Paso 3: Revisión y envío -->
      <fieldset class="form-step">
        <legend>Review & Submit</legend>
        <p>Please review your information before submiting.</p>

        <button type="button" class="prev-btn">Previous</button>
        <!-- type="submit": envía el formulario -->
        <button type="submit">Submit</button>
      </fieldset>
    </form>

    <!-- JS al final del body para que el DOM esté cargado -->
    <script src="index.js"></script>
  </body>
</html>
