<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <link rel="stylesheet" href="style.css" />
    <title>6 de corazones</title>
  </head>

  <body>
    <div class="card">
      <!-- Columna izquierda: esquina superior izquierda -->
      <div class="left">
        <div>6</div>
        <div>♥</div>
      </div>

      <!-- Columna central: 6 corazones — 2 columnas × 3 filas -->
      <div class="middle six">
        <div>♥</div>
        <div>♥</div>
        <div>♥</div>
        <div>♥</div>
        <div class="flipped">♥</div>
        <div class="flipped">♥</div>
      </div>

      <!-- Columna derecha: esquina inferior derecha (volteada) -->
      <div class="right">
        <div class="flipped">♥</div>
        <div class="flipped">6</div>
      </div>
    </div>
  </body>
</html>
