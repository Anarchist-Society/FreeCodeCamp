<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <link rel="stylesheet" href="style.css" />
    <title>8 de corazones</title>
  </head>

  <body>
    <div class="card">
      <!-- Columna izquierda: esquina superior izquierda -->
      <div class="left">
        <div>8</div>
        <div>♥</div>
      </div>

      <!-- Columna central: 8 corazones — 3 col con ajustes de posición -->
      <div class="middle eight">
        <div>♥</div>
        <div>♥</div>
        <div>♥</div> <!-- Centro: ancho completo, ajuste vertical -->
        <div>♥</div>
        <div>♥</div>
        <div class="flipped">♥</div> <!-- Centro abajo: ancho completo -->
        <div class="flipped">♥</div>
        <div class="flipped">♥</div>
      </div>

      <!-- Columna derecha: esquina inferior derecha (volteada) -->
      <div class="right">
        <div class="flipped">♥</div>
        <div class="flipped">8</div>
      </div>
    </div>
  </body>
</html>
