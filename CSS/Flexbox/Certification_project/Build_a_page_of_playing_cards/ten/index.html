<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <link rel="stylesheet" href="style.css" />
    <title>10 de corazones</title>
  </head>

  <body>
    <div class="card">
      <!-- Columna izquierda: esquina superior izquierda -->
      <div class="left">
        <div>10</div>
        <div>♥</div>
      </div>

      <!-- Columna central: 10 corazones — layout más complejo -->
      <div class="middle ten">
        <div>♥</div>
        <div>♥</div>
        <div>♥</div> <!-- Centro superior: ancho completo -->
        <div>♥</div>
        <div>♥</div>
        <div class="flipped">♥</div>
        <div class="flipped">♥</div>
        <div class="flipped">♥</div> <!-- Centro inferior: ancho completo -->
        <div class="flipped">♥</div>
        <div class="flipped">♥</div>
      </div>

      <!-- Columna derecha: esquina inferior derecha (volteada) -->
      <div class="right">
        <div class="flipped">♥</div>
        <div class="flipped">10</div>
      </div>
    </div>
  </body>
</html>
