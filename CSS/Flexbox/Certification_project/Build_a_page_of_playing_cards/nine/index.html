<!doctype html>
<html lang="en">

    <link rel="stylesheet" href="style.css" />
    <title>9 de corazones</title>
  </head>

  <body>
    <div class="card">
      <!-- Columna izquierda: esquina superior izquierda -->
      <div class="left">
        <div>9</div>
        <div>♥</div>
      </div>

      <!-- Columna central: 9 corazones — layout complejo con position:relative -->
      <div class="middle nine">
        <div>♥</div>
        <div>♥</div>
        <div>♥</div>
        <div>♥</div>
        <div>♥</div> <!-- Corazón central: ancho completo -->
        <div class="flipped">♥</div>
        <div class="flipped">♥</div>
        <div class="flipped">♥</div>
        <div class="flipped">♥</div>
      </div>

      <!-- Columna derecha: esquina inferior derecha (volteada) -->
      <div class="right">
        <div class="flipped">♥</div>
        <div class="flipped">9</div>
      </div>
    </div>
  </body>
</html>
