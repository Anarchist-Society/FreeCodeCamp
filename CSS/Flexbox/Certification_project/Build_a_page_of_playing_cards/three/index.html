<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <link rel="stylesheet" href="style.css" />
    <title>3 de corazones</title>
  </head>

  <body>
    <div class="card">
      <!-- Columna izquierda: esquina superior izquierda -->
      <div class="left">
        <div>3</div>
        <div>♥</div>
      </div>

      <!-- Columna central: 3 corazones espaciados (reutiliza .two) -->
      <div class="middle two">
        <div>♥</div>
        <div>♥</div>
        <div class="flipped">♥</div> <!-- Último volteado -->
      </div>

      <!-- Columna derecha: esquina inferior derecha (volteada 180°) -->
      <div class="right">
        <div class="flipped">♥</div>
        <div class="flipped">3</div>
      </div>
    </div>
  </body>
</html>
