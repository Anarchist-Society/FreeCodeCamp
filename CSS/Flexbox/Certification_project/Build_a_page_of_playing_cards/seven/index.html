<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <link rel="stylesheet" href="style.css" />
    <title>7 de corazones</title>
  </head>

  <body>
    <div class="card">
      <!-- Columna izquierda: esquina superior izquierda -->
      <div class="left">
        <div>7</div>
        <div>♥</div>
      </div>

      <!-- Columna central: 7 corazones — 2 col × 3 filas + 1 centro -->
      <div class="middle seven">
        <div>♥</div>
        <div>♥</div>
        <div>♥</div> <!-- Corazón central desplazado con position:relative -->
        <div>♥</div>
        <div>♥</div>
        <div class="flipped">♥</div>
        <div class="flipped">♥</div>
      </div>

      <!-- Columna derecha: esquina inferior derecha (volteada) -->
      <div class="right">
        <div class="flipped">♥</div>
        <div class="flipped">7</div>
      </div>
    </div>
  </body>
</html>
