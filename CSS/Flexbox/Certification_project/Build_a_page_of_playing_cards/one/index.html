<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <link rel="stylesheet" href="style.css" />
    <title>1 de corazones</title>
  </head>

  <body>
    <!-- Tarjeta de juego: 3 columnas flex (left, middle, right) -->
    <div class="card">
      <!-- Columna izquierda: esquina superior izquierda -->
      <div class="left">
        <div>A</div>
        <div>♥</div>
      </div>

      <!-- Columna central: corazón grande -->
      <div class="middle">
        <div>♥</div>
      </div>

      <!-- Columna derecha: esquina inferior derecha (volteada 180°) -->
      <div class="right">
        <div class="flipped">♥</div>
        <div class="flipped">A</div>
      </div>
    </div>
  </body>
</html>
