<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What Are CSS Animations, and How Do They Work?</title>
    <style>
      @keyframes slide-in {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(0);
        }
      }

      .sliding-element {
        animation: slide-in 2s ease-out infinite;
      }

      .complex-animation {
        animation-name: color-change;
        animation-duration: 3s;
        animation-timing-function: linear;
        animation-delay: 1s;
        animation-iteration-count: infinite;
        animation-direction: alternate;
      }

      @keyframes color-change {
        0% {
          background-color: red;
        }
        50% {
          background-color: blue;
        }
        100% {
          background-color: green;
        }
      }

      .button {
        background-color: blue;
        transition: background-color 0.3s;
      }

      .button:hover {
        background-color: red;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>What Are CSS Animations, and How Do They Work?</h1>

      <h2>Ejemplo 1</h2>
      <div class="sliding-element">Hello, I slide in!</div>

      <h2>Ejemplo 2</h2>
      <div class="complex-animation">Watch my colors change!</div>

      <h2>Ejemplo 3</h2>
      <button class="button">Hover over me!</button>
    </main>
  </body>
</html>
