<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House Painting</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <img id="tux-and-gnu" src="GNU-and-Tux.png" alt="tux-gju" />

    <img id="fsociety" src="fsociety.png" alt="" />

    <div id="house">
      <img id="beastie" src="Beastie.svg.png" alt="beastie" />

      <div id="chimney">
        <img class="smoke" id="smoke-1" src="arch.png" alt="arch-logo" />
        <img class="smoke" id="smoke-2" src="arch.png" alt="arch-logo" />
        <img class="smoke" id="smoke-3" src="arch.png" alt="arch-logo" />
        <img class="smoke" id="smoke-4" src="arch.png" alt="arch-logo" />
        <img class="smoke" id="smoke-5" src="arch.png" alt="arch-logo" />
        <img class="smoke" id="smoke-6" src="arch.png" alt="arch-logo" />
        <img class="smoke" id="smoke-7" src="arch.png" alt="arch-logo" />
      </div>

      <div id="roof"></div>

      <div id="window-1">
        <img id="tux" src="250px-Tux.svg.png" alt="tux" />
      </div>

      <div id="window-2">
        <img id="terry" src="terry.png" alt="terry" />
      </div>

      <div id="door">
        <div id="door-knob"></div>
      </div>
    </div>
  </body>
</html>
