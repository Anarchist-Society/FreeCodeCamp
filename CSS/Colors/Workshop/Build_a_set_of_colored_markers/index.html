<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <title>Colored Markers</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Título centrado -->
    <h1>CSS Color Markers</h1>

    <!-- Contenedor flex para los 3 marcadores -->
    <div class="container">
      <!-- Marcador rojo: tapa + manga -->
      <div class="marker red">
        <div class="cap"></div>
        <div class="sleeve"></div>
      </div>

      <!-- Marcador verde -->
      <div class="marker green">
        <div class="cap"></div>
        <div class="sleeve"></div>
      </div>

      <!-- Marcador azul -->
      <div class="marker blue">
        <div class="cap"></div>
        <div class="sleeve"></div>
      </div>
    </div>
  </body>
</html>
