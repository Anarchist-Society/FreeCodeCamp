<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport para móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <title>Gradients</title>
    <!-- CSS externo -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main>
      <!-- Gradiente lineal simple: rojo a azul -->
      <div class="linear-gradient"></div>
      <!-- Gradiente lineal multicolor: rojo, amarillo, azul -->
      <div class="multi-color-gradient"></div>
      <!-- Gradiente radial: círculo de rojo a azul -->
      <div class="radial-gradient"></div>
      <!-- Gradiente radial personalizado: elipse desde arriba a la izquierda -->
      <div class="custom-radial-gradient"></div>
      <!-- Gradiente lineal con posiciones precisas porcentaje -->
      <div class="precise-gradient"></div>
    </main>
  </body>
</html>
