<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <title>Blog Post Card</title>
    <link href="styles.css" rel="stylesheet" />
  </head>

  <body>
    <main>
      <!-- Tarjeta del post: width:350px, centrada con margin:25vh auto -->
      <div class="blog-post-card">
        <!-- Imagen: width:100%, recortada con overflow:hidden del padre -->
        <img class="post-img" src="./vim.jpg" alt="Image of Vim" />

        <!-- Contenido del post -->
        <div class="post-content">
          <h2 class="post-title">Learning the Vim Editors</h2>
          <p class="post-excerpt">Power and Agility Beyond Just Text Editing</p>
          <!-- Botón enlace "Read More" -->
          <a class="read-more" href="https://www.vim.org/">Read More</a>
        </div>
      </div>
    </main>
  </body>
</html>
