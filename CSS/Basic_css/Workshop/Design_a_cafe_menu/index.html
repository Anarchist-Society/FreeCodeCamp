<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <title>Design a Cafe Menu</title>
    <!--
      <link>: Vincula el archivo CSS externo.
      - href="styles.css": Ruta al archivo CSS (mismo directorio).
      - rel="stylesheet": Indica que es una hoja de estilos.
      
      Si no está este link, el CSS no se aplica.
    -->
    <link href="styles.css" rel="stylesheet" />
  </head>

  <body>
    <!--
      <div class="menu">: Contenedor principal del menú.
      CSS le da: width: 80%, background-color, padding, max-width: 500px.
      El body usa display: grid + place-items: center para centrarlo
      tanto horizontal como verticalmente.
    -->
    <div class="menu">
      <main>
        <!-- Título principal del café -->
        <h1>CAMPER CAFE</h1>

        <!-- "Est. 2020" en cursiva -->
        <p class="established">Est. 2020</p>

        <hr />

        <!--
          Sección de café.
          Cada artículo (article) tiene:
          - p.flavor: Nombre del café (izquierda, 70%)
          - p.price: Precio (derecha, 20%)
          
          CSS hace que ambos párrafos estén en la misma línea
          usando display: inline-block.
          
          NOTA: Se usa 70%+20% (en lugar de 75%+25%) porque
          inline-block agrega ~4px de espacio entre elementos,
          y 75%+25%+4px = overflow. Con 70%+20% = 90% hay margen.
        -->
        <section>
          <h2>Coffee</h2>

          <img
            src="https://cdn.freecodecamp.org/curriculum/css-cafe/coffee.jpg"
            alt="coffee icon"
          />

          <article class="item">
            <p class="flavor">French Vanilla</p>
            <p class="price">3.00</p>
          </article>

          <article class="item">
            <p class="flavor">Caramel Macchiato</p>
            <p class="price">3.75</p>
          </article>

          <article class="item">
            <p class="flavor">Pumpkin Spice</p>
            <p class="price">3.50</p>
          </article>

          <article class="item">
            <p class="flavor">Hazelnut</p>
            <p class="price">4.00</p>
          </article>

          <article class="item">
            <p class="flavor">Mocha</p>
            <p class="price">4.50</p>
          </article>
        </section>

        <!--
          Sección de postres.
          Misma estructura que la sección de café.
          Usa .dessert en lugar de .flavor para el nombre.
        -->
        <section>
          <h2>Desserts</h2>

          <img
            src="https://cdn.freecodecamp.org/curriculum/css-cafe/pie.jpg"
            alt="pie icon"
          />

          <article class="item">
            <p class="dessert">Donut</p>
            <p class="price">1.50</p>
          </article>

          <article class="item">
            <p class="dessert">Cherry Pie</p>
            <p class="price">2.75</p>
          </article>

          <article class="item">
            <p class="dessert">Cheesecake</p>
            <p class="price">3.00</p>
          </article>

          <article class="item">
            <p class="dessert">Cinnamon Roll</p>
            <p class="price">2.50</p>
          </article>
        </section>
      </main>

      <!--
        Línea horizontal inferior con clase "bottom-line".
        CSS le da: margin-top: 25px (separa del menú)
        y margin-bottom: 25px (separa del footer).
      -->
      <hr class="bottom-line" />

      <!--
        Pie de página con información de contacto.
        - <address>: Semánticamente indica información de contacto.
        - a target="_blank": Abre el enlace en nueva pestaña.
        - address p:first-child: Espacio de 15px entre el enlace y la dirección.
        - .address: Clase para estilizar la dirección física.
      -->
      <footer>
        <address>
          <p>
            <a href="https://www.freecodecamp.org" target="_blank"
              >Visit our website</a
            >
          </p>
          <p class="address">123 Free Code Camp Drive</p>
        </address>
      </footer>
    </div>
  </body>
</html>
