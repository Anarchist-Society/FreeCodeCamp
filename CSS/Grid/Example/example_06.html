<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Example 6</title>
    <style>
      .grid-container {
        display: grid;
        grid-template-columns: minmax(150px, 300px) 1fr;
        gap: 20px;
      }

      .grid-container > div {
        background: crimson;
        padding: 20px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <p>What Is the minmax() Function and How Does It Work?</p>
    <div class="grid-container">
      <div>
        <h2>Item 1</h2>
      </div>
      <div>
        <h2>Item 2</h2>
      </div>
    </div>
  </body>
</html>
