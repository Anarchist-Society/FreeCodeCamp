<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Example 3 Gaps</title>
    <style>
      .grid-container-1 {
        display: grid;
        height: 100px;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        column-gap: 10px;
        margin-bottom: 10px;
      }

      .grid-container-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 10px;
        row-gap: 30px;
        margin-bottom: 10px;
      }

      .grid-container-3 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px 10px;
      }

      .grid-container-1 div {
        background-color: darkblue;
      }

      .grid-container-2 div {
        height: 100px;
        background-color: darkblue;
      }

      .grid-container-3 div {
        height: 100px;
        background-color: darkblue;
      }
    </style>
  </head>

  <body>
    <p>Ejemplo 1</p>
    <div class="grid-container-1">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>

    <p>Ejemplo 2</p>
    <div class="grid-container-2">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>

    <p>Ejemplo 3</p>
    <div class="grid-container-3">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </body>
</html>
