<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Example 2 with fr Unit</title>
    <style>
      html,
      body {
        width: 90%;
        height: 50%;
      }

      /* Contenedor 1: usa porcentajes (25% cada columna) */
      .grid-container-1 {
        display: grid;
        grid-template-columns: 25% 25% 25% 25%;
        gap: 15px;
        background-color: darkgray;
        height: 100%;
        margin-bottom: 3%;
      }

      /* Contenedor 2: usa fracciones fr (1fr cada columna) */
      .grid-container-2 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        gap: 15px;
        background-color: darkgray;
        height: 100%;
      }

      .col {
        background-color: darkslateblue;
      }
    </style>
  </head>

  <body>
    <div class="grid-container-1">
      <div class="col"></div>
      <div class="col"></div>
      <div class="col"></div>
      <div class="col"></div>
    </div>

    <div class="grid-container-2">
      <div class="col"></div>
      <div class="col"></div>
      <div class="col"></div>
      <div class="col"></div>
    </div>
  </body>
</html>
