<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <title>Display Videos in an iframe</title>
  </head>

  <body>
    <main>
      <h1>iframe Video Display</h1>
      <!--
        <iframe>: Marco en línea para incrustar contenido externo (videos, mapas, etc.)
        - src: URL del contenido a incrustar.
        - allow: Funcionalidades permitidas (autoplay, clipboard, gyroscope, etc.).
        - referrerpolicy: Controla la información de referencia en peticiones cross-origin.
        - allowfullscreen: Permite pantalla completa (obsoleto, usar allow="fullscreen").
      -->
      <iframe
        width="100%"
        height="700"
        src="https://www.youtube.com/embed/I0_951_MPE0"
        allow="
          accelerometer autoplay clipboard-write encrypted-media gyroscope web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      >
      </iframe>
    </main>
  </body>
</html>
