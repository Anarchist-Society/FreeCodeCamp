<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <link rel="stylesheet" href="styles.css" />
    <title>Heart Icon</title>
  </head>

  <body>
    <main>
      <!--
        <svg>: Contenedor para gráficos vectoriales escalables (Scalable Vector Graphics).
        A diferencia de <img>, SVG se dibuja con código y se puede manipular con CSS/JS.
        
        Atributos:
        - width="24": Ancho del canvas SVG en píxeles.
        - height="24": Alto del canvas SVG en píxeles.
        - viewBox="0 0 24 24": Define el sistema de coordenadas interno.
          Primer par (0,0): Esquina superior izquierda.
          Segundo par (24,24): Esquina inferior derecha.
          Permite escalar el SVG sin perder calidad.
        - fill="red": Color de relleno de todas las figuras internas.
      -->
      <svg width="400" height="400" viewBox="0 0 24 24" fill="red">
        <!--
          <path>: Dibuja una forma libre usando comandos de trazado.
          El atributo "d" contiene los comandos:
          - M: Mover el "lapiz" a un punto (M12 21 = mover a x=12, y=21).
          - s: Curva suave (comando abreviado).
          - C: Curva cúbica de Bézier (define puntos de control).
          - L: Línea recta a un punto.
          - z: Cerrar el trazo (volver al punto inicial).
          
          Mayúsculas = coordenadas absolutas.
          Minúsculas = coordenadas relativas al punto actual.
          
          Este path dibuja la forma de un corazón.
        -->
        <path
          d="M12 21s-6-4.35-9.33-8.22C-.5 7.39 3.24 1 8.4 4.28 10.08 5.32 12 7.5 12 7.5s1.92-2.18 3.6-3.22C20.76 1 24.5 7.39 21.33 12.78 18 16.65 12 21 12 21z"
        ></path>
      </svg>
    </main>
  </body>
</html>
