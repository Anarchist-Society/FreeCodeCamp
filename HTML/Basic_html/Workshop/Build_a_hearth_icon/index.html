<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <link rel="stylesheet" href="styles.css" />
    <title>Heart Icon</title>
  </head>

  <body>
    <main>
      <!--
        <svg>: Gráficos vectoriales escalables.
        - viewBox="0 0 24 24": Sistema de coordenadas interno (esquina sup-izq a inf-der).
        - fill="red": Color de relleno de las figuras internas.
      -->
      <svg width="400" height="400" viewBox="0 0 24 24" fill="red">
        <!--
          <path d="...">: Dibuja formas libres con comandos de trazado.
          M = mover, s = curva suave, C = curva cúbica, z = cerrar trazo.
          Mayúsculas = coordenadas absolutas, minúsculas = relativas.
        -->
        <path
          d="M12 21s-6-4.35-9.33-8.22C-.5 7.39 3.24 1 8.4 4.28 10.08 5.32 12 7.5 12 7.5s1.92-2.18 3.6-3.22C20.76 1 24.5 7.39 21.33 12.78 18 16.65 12 21 12 21z"
        ></path>
      </svg>
    </main>
  </body>
</html>
