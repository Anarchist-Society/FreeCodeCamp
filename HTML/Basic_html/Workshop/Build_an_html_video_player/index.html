<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <title>Working with the HTML Video Element</title>
  </head>

  <body>
    <main>
      <h1>Working with the HTML Video Element</h1>
      <!--
        <video>: Reproduce contenido de video.
        - loop: Bucle infinito.
        - controls: Controles de reproducción.
        - muted: Silenciado por defecto (necesario para autoplay).
        - poster: Imagen antes de reproducir.
      -->
      <video
        width="70%"
        loop
        controls
        muted
        poster="https://cdn.freecodecamp.org/curriculum/labs/past-event2.jpg"
      >
        <!--
          <source>: Define fuentes del video. El navegador prueba cada una en orden.
          - type: Tipo MIME (.mp4, .webm, .ogg, .mov).
        -->
        <source
          src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4"
          type="video/mp4"
        />
        <source
          src="https://cdn.freecodecamp.org/curriculum/labs/mapmethod.webm"
          type="video/webm"
        />
        <source
          src="https://cdn.freecodecamp.org/curriculum/labs/mapmethod.ogg"
          type="video/ogg"
        />
        <source
          src="https://cdn.freecodecamp.org/curriculum/labs/mapmethod.mov"
          type="video/quicktime"
        />
      </video>
    </main>
  </body>
</html>
