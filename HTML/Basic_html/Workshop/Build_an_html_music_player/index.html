<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <title>Working with the HTML Audio Element</title>
  </head>

  <body>
    <main>
      <h1>freeCodeCamp Tunes</h1>
      <h2>Can't Stay Down</h2>
      <p>Artist: Quincy Larson</p>

      <!--
      <audio>: Reproduce contenido de audio en la página.
      No necesita contenido interno (es una etiqueta vacía).
      
      Atributos:
      - src: URL del archivo de audio (.mp3, .ogg, .wav, etc.)
      - loop: Reproduce el audio en bucle infinito (booleano).
      - controls: Muestra los controles del navegador (play, pausa, volumen).
      
      Otros atributos útiles (no usados aquí):
      - autoplay: Reproduce automáticamente al cargar (no recomendado).
      - muted: Silenciado por defecto.
      - preload: Carga el audio antes de reproducir (auto, metadata, none).
      -->
      <audio
        src="https://cdn.freecodecamp.org/curriculum/js-music-player/can't-stay-down.mp3"
        loop
        controls
      ></audio>

      <h2>Cruising for a Musing</h2>
      <p>Artist: Quincy Larson</p>
      <audio
        src="https://cdn.freecodecamp.org/curriculum/js-music-player/cruising-for-a-musing.mp3"
        loop
        controls
      ></audio>

      <h2>Scratching the Surface</h2>
      <p>Artist: Quincy Larson</p>
      <audio
        src="https://cdn.freecodecamp.org/curriculum/js-music-player/scratching-the-surface.mp3"
        loop
        controls
      ></audio>
    </main>
  </body>
</html>
