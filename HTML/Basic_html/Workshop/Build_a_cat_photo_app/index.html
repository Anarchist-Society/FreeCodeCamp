<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <link rel="stylesheet" href="styles.css" />
    <title>Build a Cat Photo App</title>
  </head>

  <body>
    <!-- <main>: Contenido principal de la página (solo uno por página) -->
    <main>
      <h1>CatPhotoApp</h1>

      <!-- <section>: Divide el contenido en secciones temáticas -->
      <section>
        <h2>Cat Photos</h2>
        <p>
          Everyone loves
          <!-- <a href="..." target="_blank">: Enlace que abre en nueva pestaña -->
          <a
            href="https://cdn.freecodecamp.org/curriculum/cat-photo-app/running-cats.jpg"
            target="_blank"
            >cute cats</a
          >
          online!
        </p>
        <p>
          See more
          <a href="https://freecatphotoapp.com" target="_blank">cat photos</a>
          in our gallery
        </p>
        <!-- <img src="..." alt="...">: Imagen. alt = texto alternativo (obligatorio) -->
        <a href="https://freecatphotoapp.com"
          ><img
            src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/relaxing-cat.jpg"
            alt="A cute orange cat lying on its back"
        /></a>
      </section>

      <section>
        <h2>Cat Lists</h2>
        <h3>Things cats love:</h3>
        <!-- <ul>: Lista desordenada (viñetas, sin orden específico) -->
        <ul>
          <!-- <li>: Elemento de lista -->
          <li>catnip</li>
          <li>laser pointers</li>
          <li>lasagna</li>
        </ul>

        <!-- <figure> + <figcaption>: Imagen con leyenda descriptiva -->
        <figure>
          <img
            src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/lasagna.jpg"
            alt="A slice of lasagna on a plate."
          />
          <figcaption>Cats <em>love</em> lasagna</figcaption>

          <h3>Top 3 things cats hate:</h3>
          <!-- <ol>: Lista ordenada (numerada, el orden SÍ importa) -->
          <ol>
            <li>flea treatment</li>
            <li>thunder</li>
            <li>other cats</li>
          </ol>

          <figure>
            <img
              src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/cats.jpg"
              alt="Two tabby kittens sleeping together on a couch."
            />
            <figcaption>Cats <strong>hate</strong> other cats.</figcaption>
          </figure>
        </figure>
      </section>
    </main>

    <!-- <footer>: Pie de página (copyright, contacto, etc.) -->
    <footer>
      <p>
        No Copyright -
        <a href="https://www.freecodecamp.org">freeCodeCamp.org</a>
      </p>
    </footer>
  </body>
</html>
