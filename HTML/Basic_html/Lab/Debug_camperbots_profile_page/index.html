<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug Campebot's Profile Page</title>
  </head>

  <body>
    <!--
      Estructura típical de una página de perfil:
      1. <main>: Contenido principal.
      2. <h1>: Título principal (solo uno por página).
      3. <h2>: Secciones principales.
      4. <h3>: Subsecciones.
      5. <p>: Párrafos de texto.
      
      En este lab (laboratorio) se practica depurar (debug) código HTML.
      Debug = encontrar y corregir errores en el código.
      
      Errores comunes en HTML:
      - Etiquetas sin cerrar.
      - Etiquetas anidadas incorrectamente.
      - Atributos faltantes o incorrectos.
      - Jerarquía de encabezados incorrecta (saltar de h1 a h3).
    -->
    <main>
      <h1>Hello from Camperbot!</h1>

      <h2>About</h2>

      <p>My name is Camperbot and I love learning new things.</p>

      <h3>Background and Interests</h3>
      <p>I enjoy solving puzzles.</p>
    </main>
  </body>
</html>
