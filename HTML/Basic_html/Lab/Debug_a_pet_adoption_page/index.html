<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <title>Debug a Pet Adoption Page</title>
  </head>

  <body>
    <!--
      Página de adopción de mascotas (lab de depuración).
      Estructura: h1 → p → h2 + img → h2 + a
    -->
    <main>
      <h1>Welcome XYZ Pet Adoption!</h1>
      <p>
        Consider adopting a pet today. We have cats, dogs, rabbits and more.
      </p>

      <h2>See our cats!</h2>
      <!-- <img>: Imagen con alt descriptivo para accesibilidad -->
      <img
        src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/cats.jpg"
        alt="Two tabby kittens sleeping together on a couch."
      />

      <h2>Adopt a cat!</h2>
      <!-- <a href="#">: Enlace temporal "#" = arriba de la página -->
      <a href="#">Visit cats page</a>

      <h2>Adopt a dog!</h2>
      <a href="#">Visit dogs page</a>
    </main>
  </body>
</html>
