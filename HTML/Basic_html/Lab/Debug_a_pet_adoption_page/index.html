<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug a Pet Adoption Page</title>
  </head>

  <body>
    <!--
      Página de adopción de mascotas.
      Estructura típical de una página informativa:
      1. Título principal (h1)
      2. Descripción breve (p)
      3. Secciones con imágenes (h2 + img)
      4. Enlaces de acción (h2 + a)
      
      Este lab practica depurar errores comunes.
    -->
    <main>
      <h1>Welcome XYZ Pet Adoption!</h1>
      <p>
        Consider adopting a pet today. We have cats, dogs, rabbits and more.
      </p>

      <h2>See our cats!</h2>
      <!--
        <img>: Inserta una imagen.
        src: URL de la imagen.
        alt: Texto alternativo (obligatorio para accesibilidad).
        
        Nota: La imagen está directamente después de h2,
        lo cual es correcto (la imagen ilustra la sección).
      -->
      <img
        src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/cats.jpg"
        alt="Two tabby kittens sleeping together on a couch."
      />

      <h2>Adopt a cat!</h2>
      <!--
        <a href="#">: Enlace con "#" como destino.
        "#" significa "arriba de la página" (no navega a ningún lado).
        Se usa temporalmente cuando el destino real aún no existe.
      -->
      <a href="#">Visit cats page</a>

      <h2>Adopt a dog!</h2>
      <a href="#">Visit dogs page</a>
    </main>
  </body>
</html>
