<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <title>HTML Audio and Video Lab</title>
  </head>

  <body>
    <!--
      Combina audio y video en la misma página.
      Diferencia clave: <audio> solo sonido, <video> muestra contenido visual + audio.
    -->
    <main>
      <h1>HTML Audio and Video Lab</h1>

      <!-- Sección de video -->
      <section>
        <h2>What is the map method and how does it work?</h2>
        <!-- <video> con <source>: Patrón para compatibilidad con múltiples formatos -->
        <video controls width="100%">
          <source
            src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4"
            type="video/mp4"
          />
        </video>
      </section>

      <!-- Sección de audio -->
      <section>
        <h2>Sailing Away</h2>
        <!-- <audio>: Más simple que <video> (sin área visual) -->
        <audio
          src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3"
          controls
          loop
        ></audio>
      </section>
    </main>
  </body>
</html>
