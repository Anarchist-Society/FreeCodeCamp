<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <!--
      Proyecto de certificación: Formulario de encuesta (survey).
      
      Estructura general:
      - div.container: Contenedor principal para centrar el contenido.
      - header: Título y descripción de la encuesta.
      - form: Todos los campos de entrada.
        - div.form-group: Agrupa cada campo (label + input).
      
      Elementos HTML usados:
      - input type="text": Texto normal.
      - input type="email": Validación de email.
      - input type="number": Solo números.
      - input type="radio": Opciones múltiples (solo una).
      - input type="checkbox": Casillas (varias seleccionables).
      - select + option: Lista desplegable.
      - textarea: Texto de múltiples líneas.
      - button type="submit": Botón para enviar.
    -->
    <div class="container">
      <header class="header">
        <!--
          id="title": Identificador para JavaScript/CSS.
          class="text-center": Clase CSS para centrar el texto.
          
          Patrón: id para funcionalidad, class para estilos.
        -->
        <h1 id="title" class="text-center">freeCodeCamp Survey Form</h1>
        <p id="description" class="description text-center">
          Thank you for taking the time to help us improve the platform
        </p>
      </header>

      <!--
        <form id="survey-form">: Formulario completo.
        El id permite manipular el form con JavaScript.
      -->
      <form id="survey-form">
        <!-- Campo de nombre -->
        <div class="form-group">
          <label id="name-label" for="name">Name</label>
          <input
            type="text"
            name="name"
            id="name"
            class="form-control"
            placeholder="Enter your name"
          />
        </div>

        <!-- Campo de email -->
        <div class="form-group">
          <label id="email-label" for="email">Email</label>
          <input
            type="email"
            name="email"
            id="email"
            class="form-control"
            placeholder="Enter your email"
          />
        </div>

        <!-- Campo de edad -->
        <div class="form-group">
          <label id="number-label" for="number"
            >Age<span class="clue">(optional)</span></label
          >
          <input
            type="number"
            name="age"
            id="number"
            min="10"
            max="99"
            class="form-control"
            placeholder="Age"
          />
        </div>

        <!--
          Radio buttons: Opciones múltiples (solo una seleccionable).
          Estructura: <label> envuelve <input> + texto.
          Esto permite hacer clic en el texto para seleccionar.
          
          name="user-recommend": Todos los radios del mismo grupo.
          Solo UNO puede estar seleccionado a la vez.
        -->
        <div class="form-group">
          <p>Would you recommend freeCodeCamp to a friend?</p>
          <label
            ><input
              type="radio"
              name="user-recommend"
              value="definitely"
              class="input-radio"
              checked
            />Definitely</label
          >

          <label
            ><input
              type="radio"
              name="user-recommend"
              value="maybe"
              class="input-radio"
            />Maybe</label
          >

          <label
            ><input
              type="radio"
              name="user-recommend"
              value="Not sure"
              class="input-radio"
            />Not sure</label
          >
        </div>

        <!--
          Select dropdown: Lista desplegable.
          <option disabled selected value>: Primera opción como placeholder.
          - disabled: No se puede seleccionar.
          - selected: Aparece por defecto.
          - value="": Valor vacío (no se envía al servidor).
        -->
        <div class="form-group">
          <p>What is your favorite feature of freeCodeCamp?</p>
          <select name="mostLike" id="most-like" class="form-control" required>
            <option disabled selected value>Select an option</option>
            <option value="challenges">Challenges</option>
            <option value="projects">Projects</option>
            <option value="community">Community</option>
            <option value="openSource">Open Source</option>
          </select>
        </div>

        <!--
          Checkboxes: Casillas de verificación (varias seleccionables).
          name="prefer": Todos comparten el mismo nombre.
          Esto permite enviar múltiples valores seleccionados.
        -->
        <div class="form-group">
          <p>
            What would you like to see improved?
            <span class="clue">(Check all that apply)</span>
          </p>
          <label
            ><input
              type="checkbox"
              name="prefer"
              value="front-end-projects"
              class="input-checkbox"
            />Front-end Projects</label
          >
          <label
            ><input
              type="checkbox"
              name="prefer"
              value="back-end-projects"
              class="input-checked"
            />Back-end Projects</label
          >
          <label
            ><input
              type="checkbox"
              name="prefer"
              value="data-visualization"
              class="input-checked"
            />Data Visualization</label
          >
          <label
            ><input
              type="checkbox"
              name="prefer"
              value="challenges"
              class="input-checked"
            />Challenges</label
          >
          <label
            ><input
              type="checkbox"
              name="prefer"
              value="open-source-community"
              class="input-checked"
            />Open Source Community</label
          >
          <label
            ><input
              type="checkbox"
              name="prefer"
              value="gitter-help-rooms"
              class="input-checked"
            />Gitter help rooms</label
          >
          <label
            ><input
              type="checkbox"
              name="prefer"
              value="videos"
              class="input-checked"
            />Videos</label
          >
          <label
            ><input
              type="checkbox"
              name="prefer"
              value="city-meetups"
              class="input-checked"
            />City Meetups</label
          >
          <label
            ><input
              type="checkbox"
              name="prefer"
              value="wiki"
              class="input-checked"
            />Wiki</label
          >
          <label
            ><input
              type="checkbox"
              name="prefer"
              value="forum"
              class="input-checked"
            />Forum</label
          >
          <label
            ><input
              type="checkbox"
              name="prefer"
              value="aditional-courses"
              class="input-checked"
            />Additional Courses</label
          >
        </div>

        <!-- Textarea para comentarios -->
        <div class="form-group">
          <p>Any comments or suggestions?</p>
          <textarea
            name="comment"
            id="comments"
            class="input-textare"
            placeholder="Enter your comments here..."
          ></textarea>
        </div>

        <!-- Botón de envío -->
        <div class="form-group">
          <button type="submit" id="submit" class="submit-button">
            Submit
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
