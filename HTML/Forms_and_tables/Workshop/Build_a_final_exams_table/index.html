<!doctype html>
<html lang="en">
  <head>
    <title>Calculus Final Exams Table</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
  </head>

  <body>
    <main>
      <!--
        <table>: Tabla de datos (NO para diseño, usar CSS Grid/Flexbox).
        Estructura: caption → thead → tbody → tfoot.
        - <tr>: Fila. - <th>: Celda de encabezado (negrita+centrada). - <td>: Celda de datos.
      -->
      <table>
        <!-- <caption>: Título de la tabla (obligatorio para accesibilidad) -->
        <caption>
          Calculus Final Exam Grades
        </caption>

        <!-- <thead>: Filas de encabezado (columnas) -->
        <thead>
          <tr>
            <th>Last Name</th>
            <th>First Name</th>
            <th>Grade</th>
          </tr>
        </thead>

        <!-- <tbody>: Filas con datos principales -->
        <tbody>
          <tr>
            <td>Davis</td>
            <td>Alex</td>
            <td>54</td>
          </tr>

          <tr>
            <td>Doe</td>
            <td>Samantha</td>
            <td>92</td>
          </tr>

          <tr>
            <td>Rodriguez</td>
            <td>Marcus</td>
            <td>88</td>
          </tr>

          <tr>
            <td>Thompson</td>
            <td>Jane</td>
            <td>77</td>
          </tr>

          <tr>
            <td>Williams</td>
            <td>Natalie</td>
            <td>83</td>
          </tr>
        </tbody>

        <!-- <tfoot>: Pie de tabla (totales, promedios) -->
        <tfoot>
          <tr>
            <!-- colspan="2": Une 2 columnas en una celda -->
            <td colspan="2">Average Grade</td>
            <td>78.8</td>
          </tr>
        </tfoot>
      </table>
    </main>
  </body>
</html>
