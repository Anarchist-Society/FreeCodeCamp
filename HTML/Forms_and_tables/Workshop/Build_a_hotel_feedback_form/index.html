<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <title>Hotel Feedback Form</title>
  </head>

  <body>
    <header>
      <h1>Hotel Feedback Form</h1>
      <p>
        Thank you for staying with us. Please provide feedback on your recent
        stay.
      </p>
    </header>

    <main>
      <!--
        <form method="POST" action="URL">:
        - method="POST": Envía datos en el cuerpo (más seguro que GET).
        - action="URL": Servidor que procesará los datos.
      -->
      <form method="POST" action="https://hotel-feedback.freecodecamp.org">

        <!-- <fieldset> + <legend>: Agrupa campos con un título descriptivo -->
        <fieldset>
          <legend>Personal Information</legend>

          <!-- <label for="id">: Conecta con el input. Clic en label = focus en input -->
          <label for="full-name">Name (required):</label>
          <!--
            <input>: Campo de entrada.
            - type="text": Texto normal. - id: Para conectar con label.
            - name: Clave en los datos enviados. - placeholder: Texto de ejemplo.
            - required: Obligatorio. - size: Ancho visual en caracteres.
          -->
          <input
            type="text"
            id="full-name"
            name="name"
            placeholder="e.g., John Doe"
            required
            size="20"
          />

          <label for="email">Email address (required):</label>
          <!-- type="email": Valida formato email automáticamente -->
          <input
            placeholder="example@email.com"
            required
            id="email"
            type="email"
            name="email"
            size="20"
          />

          <label for="age">Age (optional):</label>
          <!-- type="number": Solo números. min/max = rango permitido -->
          <input type="number" name="age" id="age" min="3" max="100" />
        </fieldset>

        <fieldset>
          <legend>Was this your first time at our hotel?</legend>
          <!--
            type="radio": Opción múltiple (solo una seleccionable).
            name="hotel-stay": Todos los radios del mismo grupo comparten name.
            value: Valor que se envía si se selecciona.
          -->
          <input id="yes-option" type="radio" name="hotel-stay" value="yes" />
          <label for="yes-option">Yes</label>
          <input id="no-option" type="radio" name="hotel-stay" value="no" />
          <label for="no-option">No</label>
        </fieldset>

        <fieldset>
          <legend>
            Why did you choose to stay at our hotel? (Check all that apply)
          </legend>

          <!--
            type="checkbox": Casilla de verificación (varias seleccionables).
            checked: Marca por defecto.
          -->
          <input type="checkbox" id="ads" name="choice" value="ads" />
          <label for="ads">Social Media Ads</label>

          <input
            type="checkbox"
            id="recommendation"
            name="choice"
            value="recommendation"
          />
          <label for="recommendation">Personal Recommendation</label>

          <input type="checkbox" id="location" name="choice" value="location" />
          <label for="location">Location</label>

          <input
            checked
            type="checkbox"
            id="reputation"
            name="choice"
            value="reputation"
          />
          <label for="reputation">Reputation</label>

          <input type="checkbox" id="price" name="choice" value="price" />
          <label for="price">Price</label>
        </fieldset>

        <fieldset>
          <legend>Ratings</legend>

          <label for="service">How was the service?</label>
          <!--
            <select> + <option>: Lista desplegable.
            selected: Opción por defecto.
          -->
          <select name="service" id="service">
            <option value="poor">Poor</option>
            <option value="satisfactory">Satisfactory</option>
            <option value="good">Good</option>
            <option value="very-good">Very Good</option>
            <option selected value="excellent">Excellent</option>
          </select>

          <label for="food">How was the food?</label>

          <select name="food" id="food">
            <option value="poor">Poor</option>
            <option value="satisfactory">Satisfactory</option>
            <option value="good">Good</option>
            <option value="very-good">Very Good</option>
            <option selected value="excellent">Excellent</option>
          </select>
        </fieldset>

        <label for="comments">Other Comments?</label>
        <!-- <textarea>: Texto multilínea. cols = ancho, rows = alto en líneas -->
        <textarea cols="30" rows="10" name="comments" id="comments"></textarea>

        <!-- type="submit": Envía el form. type="reset" limpia. type="button" = nada -->
        <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
