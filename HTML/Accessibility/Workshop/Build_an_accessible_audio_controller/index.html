<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <title>Accessible Controls</title>
  </head>

  <body>
    <main>
      <h1>Audio Controls</h1>

      <!-- type="button": Botón que NO envía formularios (sin type = submit por defecto) -->
      <button type="button">Play</button>

      <div>
        <!-- aria-labelledby: Asocia el input con múltiples labels descriptivos -->
        <span id="volume-label">Volume</span>
        <span id="volume-description">Adjust the sound level</span>
        <!--
          type="range": Slider deslizante.
          - min/max/value: Rango y valor inicial.
          - aria-labelledby: El lector de pantalla lee "Volume, Adjust the sound level, slider, 50%"
        -->
        <input
          type="range"
          min="0"
          max="100"
          value="50"
          aria-labelledby="volume-label volume-description"
        />
      </div>

      <button type="button">Mute</button>
    </main>
  </body>
</html>
