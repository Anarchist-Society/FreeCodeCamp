<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejercicios de FreeCodeCamp" />
    <title>Checkout Page</title>
  </head>

  <body>
    <main>
      <h1>Checkout</h1>

      <!-- Sección del carrito -->
      <section>
        <h2>Your Cart</h2>
        <img
          src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg"
          alt="An imagen of rubik cube"
        />
        <p>Rubik's 3x3 Cube</p>
        <p>9.49€</p>
      </section>

      <!-- Sección de pago -->
      <section>
        <h2>Payment Information</h2>
        <form>
          <!-- aria-hidden="true": Oculta el asterisco decorativo de los lectores de pantalla -->
          <label for="card-name"
            >Cardholder name <span aria-hidden="true">*</span></label
          >
          <input type="text" id="card-name" name="card-name" required />

          <label for="card-number"
            >Card Number <span aria-hidden="true">*</span></label
          >
          <!-- aria-describedby: Asocia el input con una descripción adicional -->
          <input
            type="text"
            id="card-number"
            name="card-number"
            aria-describedby="card-number-help"
            required
          />
          <!-- Descripción asociada con aria-describedby -->
          <p id="card-number-help">
            Please enter your 16-digit card number without spaces or dashes.
          </p>

          <label for="expiry-date"
            >Expire Date <span aria-hidden="true">*</span></label
          >
          <!-- placeholder: Texto de ejemplo que desaparece al escribir -->
          <input
            type="text"
            id="expiry-date"
            name="expiry-date"
            placeholder="MM/YY"
            required
          />

          <label for="cvv">CVV <span aria-hidden="true">*</span></label>
          <!-- aria-label: Nombre accesible alternativo (cuando el label es corto) -->
          <input
            type="text"
            id="cvv"
            name="cvv"
            required
            aria-label="Card Verification Value"
          />

          <input type="submit" value="Place Order" />
        </form>
      </section>
    </main>
  </body>
</html>
